<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 本草万象</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%;font-size:16px}
body{font-family:'Noto Sans SC',sans-serif;min-height:100%;background:#0a0c0f;color:#fff;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,textarea{font-family:inherit}
img{max-width:100%}

/* ========== BACKGROUND ========== */
.page-bg{position:fixed;inset:0;z-index:0;background:#0a0c0f}
.page-bg::before{content:'';position:absolute;inset:0;background:url('ca73dfc0f179bd23d8e9c1007420a3cf.png') center/cover;opacity:0.08}
.paper-texture{position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");opacity:0.03;pointer-events:none}

/* ========== NAVIGATION ========== */
.nav-bar{position:fixed;top:0;left:0;right:0;z-index:100;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;background:linear-gradient(180deg,rgba(10,12,15,0.95) 0%,rgba(10,12,15,0.8) 50%,transparent 100%);backdrop-filter:blur(10px)}
.nav-logo{display:flex;align-items:center;gap:12px;font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;color:#c9b037;letter-spacing:2px}
.nav-logo-icon{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#00d4aa,#008f6b);display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-links{display:flex;gap:40px}
.nav-link{font-size:15px;color:rgba(255,255,255,0.6);transition:all 0.3s;position:relative}
.nav-link:hover,.nav-link.active{color:#00d4aa}
.nav-link.active::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:20px;height:2px;background:#00d4aa;border-radius:1px;box-shadow:0 0 8px #00d4aa}

/* 用户菜单 */
.user-menu{position:relative;display:flex;align-items:center;gap:12px}
.user-avatar{width:40px;height:40px;border-radius:50%;border:2px solid #00d4aa;cursor:pointer;overflow:hidden;transition:all 0.3s}
.user-avatar:hover{box-shadow:0 0 20px rgba(0,212,170,0.4)}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.login-btn{padding:10px 24px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.3);border-radius:6px;color:#00d4aa;font-size:14px;cursor:pointer;transition:all 0.3s;font-family:'Noto Serif SC',serif;letter-spacing:1px}
.login-btn:hover{background:rgba(0,212,170,0.2);border-color:#00d4aa;box-shadow:0 0 15px rgba(0,212,170,0.3)}
.user-dropdown{position:absolute;top:55px;right:0;width:180px;background:rgba(20,24,32,0.95);border:1px solid rgba(0,212,170,0.2);border-radius:8px;backdrop-filter:blur(10px);opacity:0;visibility:hidden;transform:translateY(-10px);transition:all 0.3s}
.user-dropdown.show{opacity:1;visibility:visible;transform:translateY(0)}
.user-dropdown-item{padding:12px 20px;font-size:14px;color:rgba(255,255,255,0.8);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:10px}
.user-dropdown-item:first-child{border-radius:8px 8px 0 0}
.user-dropdown-item:last-child{border-radius:0 0 8px 8px}
.user-dropdown-item:hover{background:rgba(0,212,170,0.1);color:#00d4aa}
.user-dropdown-divider{height:1px;background:rgba(0,212,170,0.1);margin:4px 0}

/* ========== MAIN CONTAINER ========== */
.main-container{position:relative;z-index:10;padding-top:90px;padding-bottom:60px;min-height:100vh}
.profile-wrapper{max-width:1200px;margin:0 auto;padding:0 40px}

/* ========== PROFILE HEADER ========== */
.profile-header{background:rgba(20,24,32,0.6);border:1px solid rgba(0,212,170,0.2);border-radius:16px;backdrop-filter:blur(10px);padding:40px;margin-bottom:24px;position:relative;overflow:hidden}
.profile-header::before{content:'';position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,212,170,0.1) 0%,transparent 100%)}

/* 装饰边框 - 卷轴风格 */
.header-decoration{position:absolute;top:10px;bottom:10px;left:10px;width:4px;background:linear-gradient(180deg,transparent,#c9b037,transparent);opacity:0.5}
.header-decoration.right{left:auto;right:10px}

.profile-header-content{position:relative;display:flex;gap:40px;align-items:flex-start}

/* 头像区 */
.avatar-section{position:relative}
.avatar-frame{width:140px;height:140px;border-radius:50%;padding:6px;background:linear-gradient(135deg,#c9b037,#8b6914);position:relative;box-shadow:0 0 30px rgba(201,176,55,0.3)}
.avatar-frame::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px dashed rgba(201,176,55,0.3);animation:rotate 20s linear infinite}
.avatar-frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #0a0c0f}
.avatar-edit{position:absolute;bottom:5px;right:5px;width:36px;height:36px;background:#00d4aa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all 0.3s;box-shadow:0 0 15px rgba(0,212,170,0.4)}
.avatar-edit:hover{transform:scale(1.1);background:#00f5c4}

/* 徽章 */
.badge-section{position:absolute;top:0;right:0;display:flex;gap:10px}
.level-badge{padding:6px 16px;background:linear-gradient(135deg,#c9b037,#8b6914);border-radius:20px;font-size:13px;color:#000;font-weight:600;display:flex;align-items:center;gap:6px}
.level-badge.scholar{background:linear-gradient(135deg,#00d4aa,#008f6b);color:#fff}
.level-badge.expert{background:linear-gradient(135deg,#ff6b6b,#ee5a5a);color:#fff}

/* 用户信息 */
.user-info{flex:1}
.user-nickname{font-family:'Noto Serif SC',serif;font-size:32px;font-weight:700;margin-bottom:10px;letter-spacing:2px}
.user-bio{font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:24px;padding:10px 16px;background:rgba(0,212,170,0.05);border-left:3px solid #00d4aa;border-radius:0 8px 8px 0;display:inline-block}

/* 社交数据 */
.social-stats{display:flex;gap:40px}
.stat-item{text-align:center;cursor:pointer;transition:all 0.3s}
.stat-item:hover{transform:translateY(-2px)}
.stat-value{font-family:'SF Mono','Consolas',monospace;font-size:28px;font-weight:700;color:#00d4aa;text-shadow:0 0 10px rgba(0,212,170,0.3)}
.stat-label{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px}

/* 操作按钮 */
.header-actions{display:flex;gap:12px;margin-top:20px}
.action-btn{padding:10px 24px;border-radius:6px;font-size:14px;transition:all 0.3s;display:flex;align-items:center;gap:8px}
.action-btn.primary{background:linear-gradient(135deg,#00d4aa,#008f6b);color:#000;font-weight:500}
.action-btn.primary:hover{box-shadow:0 0 20px rgba(0,212,170,0.4);transform:translateY(-2px)}
.action-btn.secondary{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff}
.action-btn.secondary:hover{background:rgba(255,255,255,0.15);border-color:#00d4aa;color:#00d4aa}

/* ========== TAB NAVIGATION ========== */
.tab-bar{background:rgba(20,24,32,0.6);border:1px solid rgba(0,212,170,0.2);border-radius:12px;backdrop-filter:blur(10px);padding:8px;margin-bottom:24px;position:sticky;top:80px;z-index:50}
.tab-list{display:flex;gap:8px}
.tab-item{flex:1;padding:14px 24px;text-align:center;font-size:15px;color:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.3s;border-radius:8px;position:relative;font-family:'Noto Serif SC',serif;letter-spacing:1px}
.tab-item:hover{color:rgba(255,255,255,0.9);background:rgba(0,212,170,0.05)}
.tab-item.active{background:rgba(0,212,170,0.15);color:#00d4aa}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:30px;height:2px;background:#00d4aa;border-radius:1px;box-shadow:0 0 8px #00d4aa}
.tab-badge{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 6px;background:#ff6b6b;border-radius:9px;font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}

/* ========== CONTENT AREA ========== */
.tab-content{display:none}
.tab-content.active{display:block}
.content-area{background:rgba(20,24,32,0.4);border:1px solid rgba(0,212,170,0.15);border-radius:16px;backdrop-filter:blur(10px);min-height:500px;padding:30px}

/* ========== NOTES TAB ========== */
.notes-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.section-title{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:600;letter-spacing:2px}
.section-title::before{content:'◆';color:#00d4aa;margin-right:10px;font-size:18px}
.create-note-btn{padding:12px 24px;background:linear-gradient(135deg,#00d4aa,#008f6b);border-radius:8px;color:#000;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;transition:all 0.3s}
.create-note-btn:hover{box-shadow:0 0 20px rgba(0,212,170,0.4);transform:translateY(-2px)}

/* 笔记网格 */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.note-card{background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,170,0.2);border-radius:12px;overflow:hidden;transition:all 0.3s;cursor:pointer}
.note-card:hover{transform:translateY(-5px);border-color:rgba(0,212,170,0.4);box-shadow:0 10px 40px rgba(0,212,170,0.15)}
.note-cover{height:160px;background:linear-gradient(135deg,rgba(0,212,170,0.2),rgba(0,143,107,0.2));display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden}
.note-cover img{width:100%;height:100%;object-fit:cover}
.note-cover-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.8) 100%)}
.note-content{padding:20px}
.note-title{font-size:16px;font-weight:600;margin-bottom:10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-excerpt{font-size:13px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,0.4)}
.note-date{display:flex;align-items:center;gap:6px}
.note-stats{display:flex;gap:16px}
.note-stat{display:flex;align-items:center;gap:4px}
.note-stat.liked{color:#ff6b6b}

/* 药物引用卡片 */
.note-herbs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.herb-tag{padding:4px 10px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);border-radius:4px;font-size:12px;color:#00d4aa;display:flex;align-items:center;gap:4px}
.herb-tag::before{content:'🌿'}

/* ========== COLLECTIONS TAB ========== */
.collections-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.collection-card{background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,170,0.2);border-radius:12px;overflow:hidden;transition:all 0.3s;position:relative}
.collection-card:hover{transform:scale(1.03);border-color:rgba(0,212,170,0.4)}
.collection-img{height:200px;background:linear-gradient(135deg,rgba(201,176,55,0.1),rgba(139,105,20,0.1));display:flex;align-items:center;justify-content:center;font-size:64px}
.collection-img img{width:100%;height:100%;object-fit:cover}
.collection-info{padding:16px}
.collection-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;margin-bottom:6px}
.collection-latin{font-size:12px;color:#00d4aa;font-style:italic;margin-bottom:8px}
.collection-note{font-size:12px;color:rgba(255,255,255,0.5);padding:8px;background:rgba(0,212,170,0.05);border-radius:6px;border-left:2px solid #00d4aa}
.collection-time{font-size:11px;color:rgba(255,255,255,0.3);margin-top:10px}
.collection-actions{position:absolute;top:10px;right:10px;display:flex;gap:8px;opacity:0;transition:all 0.3s}
.collection-card:hover .collection-actions{opacity:1}
.collection-action{width:32px;height:32px;background:rgba(0,0,0,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;cursor:pointer;transition:all 0.3s}
.collection-action:hover{background:#ff6b6b}

/* ========== BOOKMARKS TAB ========== */
.bookmarks-list{display:flex;flex-direction:column;gap:16px}
.bookmark-item{background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,170,0.2);border-radius:12px;padding:20px;display:flex;gap:20px;transition:all 0.3s}
.bookmark-item:hover{border-color:rgba(0,212,170,0.4);background:rgba(0,212,170,0.05)}
.bookmark-icon{width:60px;height:60px;background:linear-gradient(135deg,rgba(201,176,55,0.2),rgba(139,105,20,0.2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.bookmark-content{flex:1}
.bookmark-source{font-size:13px;color:#c9b037;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.bookmark-source::before{content:'📚'}
.bookmark-preview{font-family:'Noto Serif SC',serif;font-size:15px;color:rgba(255,255,255,0.8);line-height:1.6;margin-bottom:12px;padding-left:16px;border-left:3px solid rgba(0,212,170,0.3)}
.bookmark-note{background:rgba(0,212,170,0.05);padding:12px;border-radius:8px;font-size:13px;color:rgba(255,255,255,0.6);font-style:italic}
.bookmark-note::before{content:'💭 ';color:#00d4aa}
.bookmark-actions{display:flex;flex-direction:column;justify-content:center;gap:12px}
.bookmark-action{padding:8px 16px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);border-radius:6px;font-size:13px;color:#00d4aa;cursor:pointer;transition:all 0.3s}
.bookmark-action:hover{background:#00d4aa;color:#000}

/* ========== COMMENTS TAB ========== */
.comments-list{display:flex;flex-direction:column;gap:20px}
.comment-item{background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,170,0.2);border-radius:12px;padding:20px}
.comment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.comment-author{display:flex;align-items:center;gap:12px}
.comment-avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(0,212,170,0.3)}
.comment-info{display:flex;flex-direction:column}
.comment-name{font-size:14px;font-weight:600}
.comment-target{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px}
.comment-target a{color:#00d4aa}
.comment-time{font-size:12px;color:rgba(255,255,255,0.4)}
.comment-content{font-size:14px;color:rgba(255,255,255,0.8);line-height:1.8;margin-left:52px;margin-bottom:12px}
.comment-actions{margin-left:52px;display:flex;gap:20px}
.comment-action{font-size:13px;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:6px}
.comment-action:hover{color:#00d4aa}

/* 回复嵌套 */
.replies{margin-left:52px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(0,212,170,0.1)}
.reply-item{display:flex;gap:12px;margin-bottom:12px}
.reply-item:last-child{margin-bottom:0}
.reply-avatar{width:32px;height:32px;border-radius:50%;border:1px solid rgba(0,212,170,0.2)}
.reply-content{flex:1;background:rgba(0,212,170,0.05);padding:12px;border-radius:8px}
.reply-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.reply-name{font-size:13px;font-weight:600}
.reply-to{font-size:12px;color:rgba(255,255,255,0.4)}
.reply-to span{color:#00d4aa}
.reply-text{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6}

/* ========== CREATE NOTE MODAL ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s}
.modal-overlay.show{display:flex;opacity:1}
.modal-container{width:90%;max-width:800px;max-height:90vh;background:rgba(20,24,32,0.95);border:1px solid rgba(0,212,170,0.3);border-radius:16px;backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden;transform:scale(0.95);transition:transform 0.3s}
.modal-overlay.show .modal-container{transform:scale(1)}
.modal-header{padding:24px;border-bottom:1px solid rgba(0,212,170,0.1);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;letter-spacing:1px}
.modal-close{width:36px;height:36px;background:rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.3s}
.modal-close:hover{background:#ff6b6b;color:#fff}
.modal-body{padding:24px;overflow-y:auto;flex:1}

/* 表单样式 */
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:8px;letter-spacing:1px}
.form-label span{color:#ff6b6b;margin-left:4px}
.form-input,.form-textarea{width:100%;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,170,0.2);border-radius:8px;color:#fff;font-size:14px;outline:none;transition:all 0.3s}
.form-input:focus,.form-textarea:focus{border-color:#00d4aa;box-shadow:0 0 15px rgba(0,212,170,0.2)}
.form-textarea{resize:vertical;min-height:200px;line-height:1.8}

/* 封面选择 */
.cover-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cover-option{aspect-ratio:16/10;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:all 0.3s;position:relative;background:linear-gradient(135deg,rgba(0,212,170,0.1),rgba(0,143,107,0.1));display:flex;align-items:center;justify-content:center;font-size:32px}
.cover-option.selected{border-color:#00d4aa;box-shadow:0 0 20px rgba(0,212,170,0.3)}
.cover-option img{width:100%;height:100%;object-fit:cover}
.cover-option.upload{flex-direction:column;gap:8px;font-size:14px;color:rgba(255,255,255,0.6)}

/* 标签输入 */
.tag-input-wrapper{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,170,0.2);border-radius:8px}
.tag-input-wrapper:focus-within{border-color:#00d4aa}
.tag-item{padding:4px 12px;background:rgba(0,212,170,0.15);border-radius:4px;font-size:13px;color:#00d4aa;display:flex;align-items:center;gap:6px}
.tag-remove{cursor:pointer;opacity:0.6;transition:all 0.2s}
.tag-remove:hover{opacity:1}
.tag-input{flex:1;min-width:100px;padding:4px;border:none;background:transparent;color:#fff;outline:none;font-size:13px}
.tag-input::placeholder{color:rgba(255,255,255,0.4)}

/* 可见范围 */
.visibility-options{display:flex;gap:16px}
.visibility-option{flex:1;padding:16px;border:1px solid rgba(0,212,170,0.2);border-radius:8px;cursor:pointer;transition:all 0.3s;text-align:center}
.visibility-option:hover{border-color:rgba(0,212,170,0.4);background:rgba(0,212,170,0.05)}
.visibility-option.selected{border-color:#00d4aa;background:rgba(0,212,170,0.1)}
.visibility-icon{font-size:24px;margin-bottom:8px}
.visibility-label{font-size:14px;color:rgba(255,255,255,0.8)}
.visibility-desc{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px}

/* 引用药物 */
.herb-reference-box{padding:16px;background:rgba(0,212,170,0.05);border:1px dashed rgba(0,212,170,0.3);border-radius:8px;margin-top:16px}
.herb-reference-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.herb-reference-title{font-size:14px;color:#00d4aa}
.add-herb-btn{padding:6px 12px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);border-radius:6px;font-size:12px;color:#00d4aa;cursor:pointer;transition:all 0.3s}
.add-herb-btn:hover{background:#00d4aa;color:#000}
.selected-herbs{display:flex;flex-wrap:wrap;gap:8px}

.selected-herb-name{font-weight:600}

.btn-secondary{background:rgba(255,255,255,0.1);color:#fff}

.herb-result-item:hover{background:rgba(0,212,170,0.1);border-color:#00d4aa}
.herb-result-img{width:60px;height:60px;border-radius:8px;background:linear-gradient(135deg,rgba(0,212,170,0.1),rgba(0,143,107,0.1));display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}

.herb-result-latin{font-size:12px;color:#00d4aa;font-style:italic}
.herb-result-desc{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px}
.herb-result-add{padding:8px 16px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);border-radius:6px;color:#00d4aa;font-size:13px;transition:all 0.3s}
.herb-result-item:hover .herb-result-add{background:#00d4aa;color:#000}

/* ========== ANIMATIONS ========== */
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.particles-container{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:#00d4aa;border-radius:50%;opacity:0.4;animation:particle linear infinite}
.particle:nth-child(1){left:10%;animation-duration:15s;animation-delay:0s}

@keyframes particle{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100vh) translateX(50px);opacity:0}}
</style>

<script>
// ========== USER DATA ==========
let currentUser = null;
let notes = [];
let collections = [];
let bookmarks = [];
let comments = [];
let selectedHerbsInNote = [];
let currentTags = [];

// ========== INITIALIZATION ==========
document.addEventListener('DOMContentLoaded', () => {
  checkAuthAndLoad();
  loadMockData();
  renderAllData();
  setupEventListeners();
});

function checkAuthAndLoad() {
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  if (!isLoggedIn || isLoggedIn !== 'true') {
    window.location.href = 'login.html';
    return;
  }
  currentUser = JSON.parse(localStorage.getItem('benCaoUser') || '{}');
  loadUserData();
}

function loadUserData() {
  if (currentUser) {
    const navUserAvatar = document.getElementById('navUserAvatar');
    if (navUserAvatar) navUserAvatar.src = currentUser.avatar;
    document.getElementById('profileAvatar').src = currentUser.avatar;
    document.getElementById('profileNickname').textContent = currentUser.nickname;
    document.getElementById('profileBio').textContent = currentUser.bio;
    document.getElementById('followCount').textContent = formatNumber(currentUser.follow_count);
    document.getElementById('fanCount').textContent = formatNumber(currentUser.fan_count);
    document.getElementById('likeCount').textContent = formatNumber(currentUser.like_count);
    document.getElementById('userLevel').textContent = getLevelBadge(currentUser.level);
  }
}

function getLevelBadge(level) {
  const badges = {
    '认证学者': '🏅 认证学者',
    '项目专家': '⭐ 项目专家',
    '游客': '👤 游客'
  };
  return badges[level] || '👤 用户';
}

function formatNumber(num) {
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num.toString();
}

  );

function renderHerbResults(herbs) {
  const container = document.getElementById('herbResults');

function addHerbToNote(herbId) {
  const herb = mockHerbs.find(h => h.id === herbId);

  renderSelectedHerbs();
  closeModal('herbSelectorModal');

// ========== TAG INPUT ==========
function setupTagInput() {
  const tagInput = document.getElementById('tagInput');
  if (!tagInput) return;

  tagInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      const value = tagInput.value.trim();
      if (value && !currentTags.includes(value)) {
        currentTags.push(value);
        renderTags();
        tagInput.value = '';
      }
    }
  });
}

function renderTags() {
  const wrapper = document.getElementById('tagInputWrapper');
  const tagsHtml = currentTags.map(tag => `
    <span class="tag-item">
      #${tag}
      <span class="tag-remove" onclick="removeTag('${tag}')">✕</span>
    </span>
  `).join('');

  wrapper.innerHTML = tagsHtml + '<input type="text" class="tag-input" placeholder="添加标签，回车确认" id="tagInput">';
  setupTagInput();
  document.getElementById('tagInput').focus();
}

function removeTag(tag) {
  currentTags = currentTags.filter(t => t !== tag);
  renderTags();
}

// ========== PUBLISH NOTE ==========
function publishNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const content = document.getElementById('noteContent').value.trim();

  if (!title || !content) {
    alert('请填写标题和正文');
    return;
  }

  const newNote = {
    id: Date.now(),
    title: title,
    excerpt: content.substring(0, 100) + '...',
    content: content,
    cover: '📝',
    date: new Date().toISOString().split('T')[0],
    likes: 0,
    comments: 0,
    collects: 0,
    isLiked: false,
    isCollected: false,
    herbs: selectedHerbsInNote,
    tags: currentTags,
    author: currentUser
  };

  notes.unshift(newNote);
  document.getElementById('noteCount').textContent = notes.length;
  renderNotes();
  closeModal('createNoteModal');
  alert('笔记发布成功！');
}

function editProfile() {
  const newNickname = prompt('请输入新昵称：', currentUser.nickname);
  if (newNickname && newNickname.trim()) {
    currentUser.nickname = newNickname.trim();
    localStorage.setItem('benCaoUser', JSON.stringify(currentUser));
    loadUserData();
  }
}

function removeCollection(id, event) {
  event.stopPropagation();
  if (confirm('确定要取消收藏吗？')) {
    collections = collections.filter(c => c.id !== id);
    document.getElementById('collectionCount').textContent = collections.length;
    renderCollections();
  }
}

function deleteBookmark(id) {
  if (confirm('确定要删除此书签吗？')) {
    bookmarks = bookmarks.filter(b => b.id !== id);
    document.getElementById('bookmarkCount').textContent = bookmarks.length;
    renderBookmarks();
  }
}
